<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cảm ơn bạn đã đặt hàng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F6E7B2; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #5A2D0C; 
        }
        .container {
            text-align: center;
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid #8B5A2B; 
            max-width: 400px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-home {
            display: inline-block;
            text-decoration: none;
            background-color: #8B5A2B;
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-home:hover {
            background-color: #5A2D0C;
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="font-size: 50px; color: #2ecc71;">✔</div>
        <h1>ĐẶT HÀNG THÀNH CÔNG!</h1>
        <p>Cảm ơn bạn đã tin tưởng Ẩm thực Tây Bắc.<br>
           Chúng tôi sẽ sớm liên hệ với bạn qua số điện thoại để xác nhận đơn hàng.</p>
        
        <a href="index.html" class="btn-home">Quay lại Trang chủ</a>
    </div>

</body>
</html>
